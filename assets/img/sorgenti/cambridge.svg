    <path d="M110 330 h230 a28 28 0 0 1 28 28 v74 a28 28 0 0 1 -28 28 h-150 l-44 38 v-38 h-36 a28 28 0 0 1 -28 -28 v-74 a28 28 0 0 1 28 -28 Z" fill="#ffffff"/>
